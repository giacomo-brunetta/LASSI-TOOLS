<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540" role="img" aria-labelledby="title description">
  <title id="title">Scientific translation arena pipeline flow</title>
  <desc id="description">Current pipeline from configuration and C reference oracle through a configurable Hermes arena (three candidates shown), validation and repair, low-precision compensation, measurements, Pareto frontier construction, and persisted run artifacts.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .phase { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; fill: #64748b; }
      .heading { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .code { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
      .white-heading { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .white-body { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ede9fe; }
      .node { stroke-width: 1.5; filter: url(#shadow); }
      .deterministic { fill: #ffffff; stroke: #94a3b8; }
      .agent { fill: #f5f3ff; stroke: #8b5cf6; }
      .gate { fill: #ecfdf5; stroke: #10b981; }
      .artifact { fill: #eff6ff; stroke: #3b82f6; }
      .failure { fill: #fef2f2; stroke: #ef4444; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .agent-flow { fill: none; stroke: #7c3aed; stroke-width: 2; marker-end: url(#arrow-purple); }
      .failure-flow { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-red); }
      .group { fill: #ffffff; fill-opacity: 0.62; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1600" height="1540" fill="url(#background)"/>

  <text x="800" y="48" text-anchor="middle" class="title">Current Translation Arena Pipeline</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">Imperative async orchestration with persistent Hermes sessions and external validation gates</text>

  <!-- Legend -->
  <g transform="translate(340 98)">
    <rect x="0" y="0" width="920" height="54" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="24" y="17" width="20" height="20" rx="4" class="deterministic"/><text x="54" y="32" class="small">Deterministic orchestration</text>
    <rect x="245" y="17" width="20" height="20" rx="4" class="agent"/><text x="275" y="32" class="small">Hermes agent work</text>
    <rect x="444" y="17" width="20" height="20" rx="4" class="gate"/><text x="474" y="32" class="small">Validation gate</text>
    <rect x="600" y="17" width="20" height="20" rx="4" class="artifact"/><text x="630" y="32" class="small">Persisted artifact</text>
    <line x1="770" y1="27" x2="814" y2="27" class="failure-flow"/><text x="827" y="32" class="small">Failure path</text>
  </g>

  <!-- Initialization -->
  <text x="800" y="185" text-anchor="middle" class="phase">INITIALIZE</text>
  <g transform="translate(580 200)">
    <rect width="440" height="74" rx="14" class="node deterministic"/>
    <text x="220" y="28" text-anchor="middle" class="heading">Load validated run configuration</text>
    <text x="220" y="49" text-anchor="middle" class="body">Require automation skills · create immutable run directory</text>
    <text x="220" y="65" text-anchor="middle" class="code">pipeline.run_pipeline()</text>
  </g>
  <path d="M 800 274 L 800 302" class="flow"/>

  <g transform="translate(580 305)">
    <rect width="440" height="74" rx="14" class="node deterministic"/>
    <text x="220" y="28" text-anchor="middle" class="heading">Build authoritative C/C++ FP64 oracle</text>
    <text x="220" y="49" text-anchor="middle" class="body">Compile reference · execute reference · parse canonical output</text>
    <text x="220" y="65" text-anchor="middle" class="code">validation.build_oracle()</text>
  </g>
  <path d="M 800 379 L 800 407" class="flow"/>

  <!-- Planner -->
  <text x="800" y="405" text-anchor="middle" class="phase">PLAN</text>
  <g transform="translate(580 420)">
    <rect width="440" height="82" rx="14" class="node agent"/>
    <text x="220" y="28" text-anchor="middle" class="heading">Scientific-computing architect</text>
    <text x="220" y="49" text-anchor="middle" class="body">Return arena.candidates material strategies (3 shown below)</text>
    <text x="220" y="67" text-anchor="middle" class="code">arena.plan_strategies() · persistent Hermes worker</text>
  </g>

  <!-- Fan-out lines -->
  <path d="M 800 502 L 800 530 L 260 530 L 260 550" class="agent-flow"/>
  <path d="M 800 502 L 800 550" class="agent-flow"/>
  <path d="M 800 530 L 1340 530 L 1340 550" class="agent-flow"/>
  <text x="800" y="526" text-anchor="middle" class="phase">CONFIGURED CONCURRENT CANDIDATE SESSIONS · 3 SHOWN</text>

  <!-- Candidate lanes -->
  <g transform="translate(70 550)">
    <rect width="380" height="224" rx="18" class="group"/>
    <rect width="380" height="42" rx="18" fill="#6d28d9"/><rect y="24" width="380" height="18" fill="#6d28d9"/>
    <text x="190" y="27" text-anchor="middle" class="white-heading">Candidate c1 · Strategy 1</text>
    <text x="190" y="66" text-anchor="middle" class="heading">Translation engineer generates module</text>
    <text x="190" y="87" text-anchor="middle" class="body">Assigned target only · compile-check · precision metadata</text>
    <rect x="45" y="104" width="290" height="46" rx="10" class="gate"/>
    <text x="190" y="123" text-anchor="middle" class="heading">C/C++ FP64 gate</text>
    <text x="190" y="140" text-anchor="middle" class="small">compile · execute · shape · finite · error</text>
    <path d="M 335 127 C 365 127 365 185 330 185" class="agent-flow"/>
    <text x="190" y="178" text-anchor="middle" class="body">Fail + budget → diagnose and repair in same session</text>
    <text x="190" y="198" text-anchor="middle" class="small">Pass → OK · exhausted → REJECTED · exception → CRASHED</text>
    <text x="190" y="216" text-anchor="middle" class="code">arena.generate_candidate()</text>
  </g>

  <g transform="translate(610 550)">
    <rect width="380" height="224" rx="18" class="group"/>
    <rect width="380" height="42" rx="18" fill="#6d28d9"/><rect y="24" width="380" height="18" fill="#6d28d9"/>
    <text x="190" y="27" text-anchor="middle" class="white-heading">Candidate c2 · Strategy 2</text>
    <text x="190" y="66" text-anchor="middle" class="heading">Translation engineer generates module</text>
    <text x="190" y="87" text-anchor="middle" class="body">Assigned target only · compile-check · precision metadata</text>
    <rect x="45" y="104" width="290" height="46" rx="10" class="gate"/>
    <text x="190" y="123" text-anchor="middle" class="heading">C/C++ FP64 gate</text>
    <text x="190" y="140" text-anchor="middle" class="small">compile · execute · shape · finite · error</text>
    <path d="M 335 127 C 365 127 365 185 330 185" class="agent-flow"/>
    <text x="190" y="178" text-anchor="middle" class="body">Fail + budget → diagnose and repair in same session</text>
    <text x="190" y="198" text-anchor="middle" class="small">Pass → OK · exhausted → REJECTED · exception → CRASHED</text>
    <text x="190" y="216" text-anchor="middle" class="code">arena.generate_candidate()</text>
  </g>

  <g transform="translate(1150 550)">
    <rect width="380" height="224" rx="18" class="group"/>
    <rect width="380" height="42" rx="18" fill="#6d28d9"/><rect y="24" width="380" height="18" fill="#6d28d9"/>
    <text x="190" y="27" text-anchor="middle" class="white-heading">Candidate c3 · Strategy 3</text>
    <text x="190" y="66" text-anchor="middle" class="heading">Translation engineer generates module</text>
    <text x="190" y="87" text-anchor="middle" class="body">Assigned target only · compile-check · precision metadata</text>
    <rect x="45" y="104" width="290" height="46" rx="10" class="gate"/>
    <text x="190" y="123" text-anchor="middle" class="heading">C/C++ FP64 gate</text>
    <text x="190" y="140" text-anchor="middle" class="small">compile · execute · shape · finite · error</text>
    <path d="M 335 127 C 365 127 365 185 330 185" class="agent-flow"/>
    <text x="190" y="178" text-anchor="middle" class="body">Fail + budget → diagnose and repair in same session</text>
    <text x="190" y="198" text-anchor="middle" class="small">Pass → OK · exhausted → REJECTED · exception → CRASHED</text>
    <text x="190" y="216" text-anchor="middle" class="code">arena.generate_candidate()</text>
  </g>

  <!-- Join and base measurement -->
  <path d="M 260 774 L 260 805 L 800 805 L 800 830" class="flow"/>
  <path d="M 800 774 L 800 830" class="flow"/>
  <path d="M 1340 774 L 1340 805 L 800 805" class="flow"/>
  <text x="800" y="814" text-anchor="middle" class="phase">JOIN ACCEPTED CANDIDATES</text>

  <g transform="translate(540 830)">
    <rect width="520" height="78" rx="14" class="node deterministic"/>
    <text x="260" y="28" text-anchor="middle" class="heading">Measure accepted base candidates</text>
    <text x="260" y="49" text-anchor="middle" class="body">All configured backend × precision cells · oracle-relative errors</text>
    <text x="260" y="66" text-anchor="middle" class="code">measurement.measure_variants()</text>
  </g>
  <path d="M 800 908 L 800 938" class="flow"/>

  <!-- Weak-point selection -->
  <g transform="translate(570 940)">
    <path d="M 230 0 L 460 62 L 230 124 L 0 62 Z" class="node deterministic"/>
    <text x="230" y="48" text-anchor="middle" class="heading">Select weak FP16/BF16 points</text>
    <text x="230" y="70" text-anchor="middle" class="body">failed or above threshold · same-candidate peers</text>
    <text x="230" y="89" text-anchor="middle" class="code">compensation.select_weak_points()</text>
  </g>

  <!-- Skip path -->
  <path d="M 1030 1002 L 1175 1002 L 1175 1235 L 1040 1235 L 1040 1250" class="flow"/>
  <text x="1188" y="1019" class="small">disabled / no weak points</text>

  <!-- Compensation -->
  <path d="M 800 1064 L 800 1090" class="agent-flow"/>
  <text x="800" y="1086" text-anchor="middle" class="phase">CONCURRENT PER WEAK CANDIDATE × BACKEND × PRECISION</text>
  <g transform="translate(350 1100)">
    <rect width="900" height="128" rx="18" class="node agent"/>
    <text x="450" y="27" text-anchor="middle" class="heading">Low-precision numerical specialist edits a copy</text>
    <text x="450" y="47" text-anchor="middle" class="body">Diagnose failure · choose one allowed technique · declare precision roles honestly</text>

    <rect x="65" y="65" width="235" height="42" rx="10" class="gate"/>
    <text x="182" y="83" text-anchor="middle" class="heading">Gate 1 · C/C++ FP64</text>
    <text x="182" y="99" text-anchor="middle" class="small">semantic authority</text>

    <path d="M 300 86 L 335 86" class="flow"/>
    <rect x="335" y="65" width="230" height="42" rx="10" class="gate"/>
    <text x="450" y="83" text-anchor="middle" class="heading">Gate 2 · FP32 collapse</text>
    <text x="450" y="99" text-anchor="middle" class="small">matches base algorithm</text>

    <path d="M 565 86 L 600 86" class="flow"/>
    <rect x="600" y="65" width="235" height="42" rx="10" class="deterministic"/>
    <text x="717" y="83" text-anchor="middle" class="heading">Passing variant</text>
    <text x="717" y="99" text-anchor="middle" class="small">substantive edit + both gates</text>
    <text x="450" y="121" text-anchor="middle" class="code">compensation.generate_compensation()</text>
  </g>
  <path d="M 800 1228 L 800 1250" class="flow"/>

  <!-- Final measurement and frontier -->
  <g transform="translate(540 1250)">
    <rect width="520" height="72" rx="14" class="node deterministic"/>
    <text x="260" y="27" text-anchor="middle" class="heading">Measure passing compensation variants</text>
    <text x="260" y="48" text-anchor="middle" class="body">Target cell by default · reject no numerical improvement</text>
    <text x="260" y="64" text-anchor="middle" class="code">measure_compensation_variants()</text>
  </g>
  <path d="M 800 1322 L 800 1345" class="flow"/>

  <g transform="translate(570 1348)">
    <path d="M 230 0 L 460 54 L 230 108 L 0 54 Z" class="node deterministic"/>
    <text x="230" y="45" text-anchor="middle" class="heading">Build latency × error Pareto frontier</text>
    <text x="230" y="68" text-anchor="middle" class="code">pareto.frontier_indices()</text>
  </g>
  <path d="M 800 1456 L 800 1475" class="flow"/>

  <g transform="translate(495 1477)">
    <rect width="610" height="48" rx="12" class="node artifact"/>
    <text x="305" y="21" text-anchor="middle" class="heading">Persist complete run record</text>
    <text x="305" y="39" text-anchor="middle" class="small">measurements.jsonl · frontier.json · run.json · summary.md · diagnostics</text>
  </g>

  <!-- Failure path -->
  <path d="M 580 237 L 220 237 L 220 1408 L 235 1408 L 235 1440" class="failure-flow"/>
  <text x="205" y="730" text-anchor="end" class="small" transform="rotate(-90 205 730)">uncaught exception after run directory creation</text>
  <g transform="translate(40 1440)">
    <rect width="390" height="72" rx="14" class="node failure"/>
    <text x="195" y="27" text-anchor="middle" class="heading">Persist terminal failure</text>
    <text x="195" y="48" text-anchor="middle" class="body">run.json + summary.md with exception type and message</text>
    <text x="195" y="65" text-anchor="middle" class="code">exit code 1</text>
  </g>
</svg>
