<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="845" viewBox="0 55 2400 845" role="img" aria-labelledby="title desc">
  <title id="title">Scientific translation arena pipeline, landscape layout</title>
  <desc id="desc">Left-to-right paper figure of configuration, reference oracle, planner, configurable candidate arena (three shown), base measurement, weak-point selection, compensation, targeted remeasurement, Pareto frontier, and artifacts. Insets expand the candidate and compensation repair loops.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <style>
      .t{font:700 29px Inter,system-ui,sans-serif;fill:#0f172a}.sub{font:400 14px Inter,system-ui,sans-serif;fill:#475569}
      .n{stroke-width:1.6}.d{fill:#fff;stroke:#94a3b8}.p{fill:#f5f3ff;stroke:#8b5cf6}.g{fill:#ecfdf5;stroke:#10b981}.b{fill:#eff6ff;stroke:#3b82f6}.r{fill:#fef2f2;stroke:#ef4444}
      .h{font:700 18px Inter,system-ui,sans-serif;fill:#0f172a}.x{font:400 14px Inter,system-ui,sans-serif;fill:#334155}.s{font:600 12.5px Inter,system-ui,sans-serif;fill:#64748b;letter-spacing:.8px}.m{font:500 11.5px ui-monospace,monospace;fill:#64748b}
      .f{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.fp{fill:none;stroke:#7c3aed;stroke-width:2;marker-end:url(#ap)}.fr{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#ar)}
      .in{fill:#fff;fill-opacity:.9;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect x="0" y="55" width="2400" height="845" fill="#fff"/>
  <g transform="translate(715 78)">
    <rect width="970" height="39" rx="9" fill="#fff" stroke="#dbe3ee"/>
    <rect x="18" y="11" width="17" height="17" rx="3" class="d"/><text x="44" y="24" class="x">Deterministic</text>
    <rect x="190" y="11" width="17" height="17" rx="3" class="p"/><text x="216" y="24" class="x">Hermes agent</text>
    <rect x="368" y="11" width="17" height="17" rx="3" class="g"/><text x="394" y="24" class="x">Validation gate</text>
    <rect x="548" y="11" width="17" height="17" rx="3" class="b"/><text x="574" y="24" class="x">Artifact</text>
    <path d="M700 19H742" class="fr"/><text x="756" y="24" class="x">Repair / failure</text>
  </g>

  <!-- Main spine -->
  <text x="35" y="151" class="s">1 INITIALIZE</text>
  <g transform="translate(30 163)"><rect width="190" height="108" rx="13" class="n d"/><text x="95" y="38" text-anchor="middle" class="h">Configuration</text><text x="95" y="66" text-anchor="middle" class="x">validate YAML + skills</text><text x="95" y="88" text-anchor="middle" class="x">create immutable run</text></g>
  <path d="M220 217H255" class="f"/>
  <text x="260" y="151" class="s">2 ORACLE</text>
  <g transform="translate(255 163)"><rect width="190" height="108" rx="13" class="n d"/><text x="95" y="38" text-anchor="middle" class="h">C/C++ FP64</text><text x="95" y="66" text-anchor="middle" class="x">compile + execute</text><text x="95" y="88" text-anchor="middle" class="x">parse canonical output</text></g>
  <path d="M445 217H480" class="f"/>
  <text x="485" y="151" class="s">3 PLAN</text>
  <g transform="translate(480 163)"><rect width="190" height="108" rx="13" class="n p"/><text x="95" y="38" text-anchor="middle" class="h">Architect agent</text><text x="95" y="66" text-anchor="middle" class="x">study source context</text><text x="95" y="88" text-anchor="middle" class="x">return N strategies</text></g>
  <path d="M670 217H705" class="fp"/>
  <text x="710" y="151" class="s">4 ARENA</text>
  <g transform="translate(705 163)"><rect width="220" height="108" rx="13" class="n p"/><text x="110" y="38" text-anchor="middle" class="h">N candidate agents</text><text x="110" y="66" text-anchor="middle" class="x">3 shown · concurrent</text><text x="110" y="88" text-anchor="middle" class="x">validate + repair</text></g>
  <path d="M925 217H960" class="f"/>
  <text x="965" y="151" class="s">5 MEASURE BASE</text>
  <g transform="translate(960 163)"><rect width="190" height="108" rx="13" class="n d"/><text x="95" y="38" text-anchor="middle" class="h">Accepted bases</text><text x="95" y="66" text-anchor="middle" class="x">backends × precisions</text><text x="95" y="88" text-anchor="middle" class="x">latency + oracle error</text></g>
  <path d="M1150 217H1185" class="f"/>
  <text x="1190" y="151" class="s">6 SELECT</text>
  <g transform="translate(1185 163)"><path d="M95 0 190 54 95 108 0 54Z" class="n d"/><text x="95" y="50" text-anchor="middle" class="h">Weak FP16/BF16</text><text x="95" y="73" text-anchor="middle" class="x">failed or over threshold</text></g>
  <path d="M1375 217H1410" class="fp"/>
  <text x="1415" y="151" class="s">7 COMPENSATE</text>
  <g transform="translate(1410 163)"><rect width="220" height="108" rx="13" class="n p"/><text x="110" y="38" text-anchor="middle" class="h">Compensation agents</text><text x="110" y="66" text-anchor="middle" class="x">one per weak cell</text><text x="110" y="88" text-anchor="middle" class="x">substantive edit + 2 gates</text></g>
  <path d="M1630 217H1665" class="f"/>
  <text x="1670" y="151" class="s">8 REMEASURE</text>
  <g transform="translate(1665 163)"><rect width="190" height="108" rx="13" class="n d"/><text x="95" y="38" text-anchor="middle" class="h">Passing variants</text><text x="95" y="66" text-anchor="middle" class="x">targeted remeasure</text><text x="95" y="88" text-anchor="middle" class="x">require error gain</text></g>
  <path d="M1855 217H1890" class="f"/>
  <text x="1895" y="151" class="s">9 PARETO</text>
  <g transform="translate(1890 163)"><path d="M95 0 190 54 95 108 0 54Z" class="n d"/><text x="95" y="50" text-anchor="middle" class="h">Latency × error</text><text x="95" y="73" text-anchor="middle" class="x">nondominated set</text></g>
  <path d="M2080 217H2115" class="f"/>
  <text x="2120" y="151" class="s">10 PERSIST</text>
  <g transform="translate(2115 163)"><rect width="250" height="108" rx="13" class="n b"/><text x="125" y="32" text-anchor="middle" class="h">Auditable run artifacts</text><text x="125" y="57" text-anchor="middle" class="x">measurements + frontier</text><text x="125" y="77" text-anchor="middle" class="x">run record + summary</text><text x="125" y="97" text-anchor="middle" class="m">diagnostics retained</text></g>

  <!-- Candidate inset -->
  <path d="M815 271V318" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <g transform="translate(105 322)">
    <rect width="1110" height="285" rx="17" class="in"/>
    <text x="25" y="29" class="s">CANDIDATE SUBFLOW · CONFIGURED CONCURRENT HERMES SESSIONS · THREE SHOWN</text>
    <g transform="translate(28 72)"><rect width="185" height="75" rx="11" class="n p"/><text x="92" y="27" text-anchor="middle" class="h">Generate target</text><text x="92" y="48" text-anchor="middle" class="x">assigned strategy</text><text x="92" y="65" text-anchor="middle" class="m">c1 · c2 · c3</text></g>
    <path d="M213 109H263" class="fp"/>
    <g transform="translate(263 72)"><rect width="185" height="75" rx="11" class="n d"/><text x="92" y="34" text-anchor="middle" class="h">Compile + execute</text><text x="92" y="58" text-anchor="middle" class="x">isolated runner</text></g>
    <path d="M448 109H498" class="f"/>
    <g transform="translate(498 63)"><path d="M105 0 210 47 105 94 0 47Z" class="n g"/><text x="105" y="40" text-anchor="middle" class="h">C/C++ FP64 gate</text><text x="105" y="59" text-anchor="middle" class="x">shape · finite · error</text></g>
    <path d="M708 109H758" class="f"/><text x="731" y="99" text-anchor="middle" class="s">PASS</text>
    <g transform="translate(758 72)"><rect width="185" height="75" rx="11" class="n g"/><text x="92" y="28" text-anchor="middle" class="h">Candidate OK</text><text x="92" y="50" text-anchor="middle" class="x">eligible to measure</text></g>
    <path d="M603 157V200H448" class="fr"/><text x="620" y="186" class="s">FAIL + BUDGET</text>
    <g transform="translate(248 181)"><rect width="200" height="72" rx="11" class="n p"/><text x="100" y="27" text-anchor="middle" class="h">Diagnose + repair</text><text x="100" y="49" text-anchor="middle" class="x">same target + session</text></g>
    <path d="M248 217H155V157H263V147" class="fp"/>
    <path d="M603 157V253H758" class="fr"/><text x="622" y="247" class="s">EXHAUSTED → REJECTED</text>
    <text x="965" y="113" class="x">exception → CRASHED</text>
  </g>

  <!-- Compensation inset -->
  <path d="M1520 271V318" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <g transform="translate(1245 322)">
    <rect width="1120" height="285" rx="17" class="in"/>
    <text x="25" y="29" class="s">COMPENSATION SUBFLOW · ONE CONCURRENT COPY PER WEAK CANDIDATE × BACKEND × PRECISION</text>
    <g transform="translate(25 72)"><rect width="180" height="75" rx="11" class="n p"/><text x="90" y="27" text-anchor="middle" class="h">Edit base copy</text><text x="90" y="48" text-anchor="middle" class="x">choose one technique</text><text x="90" y="65" text-anchor="middle" class="m">honest precision roles</text></g>
    <path d="M205 109H245" class="fp"/>
    <g transform="translate(245 63)"><path d="M95 0 190 47 95 94 0 47Z" class="n g"/><text x="95" y="40" text-anchor="middle" class="h">C/C++ FP64</text><text x="95" y="59" text-anchor="middle" class="x">semantic gate</text></g>
    <path d="M435 109H475" class="f"/>
    <g transform="translate(475 63)"><path d="M105 0 210 47 105 94 0 47Z" class="n g"/><text x="105" y="40" text-anchor="middle" class="h">FP32 collapse</text><text x="105" y="59" text-anchor="middle" class="x">matches base behavior</text></g>
    <path d="M685 109H725" class="f"/><text x="704" y="99" text-anchor="middle" class="s">PASS</text>
    <g transform="translate(725 72)"><rect width="190" height="75" rx="11" class="n g"/><text x="95" y="28" text-anchor="middle" class="h">Variant OK</text><text x="95" y="50" text-anchor="middle" class="x">substantive + 2 gates</text></g>
    <path d="M340 157V200H445" class="fr"/><path d="M580 157V200H445" class="fr"/>
    <g transform="translate(245 181)"><rect width="200" height="72" rx="11" class="n p"/><text x="100" y="27" text-anchor="middle" class="h">Diagnose + repair</text><text x="100" y="49" text-anchor="middle" class="x">then repeat both gates</text></g>
    <path d="M245 217H145V157H245V109" class="fp"/>
    <path d="M445 217H725" class="fr"/><text x="570" y="210" text-anchor="middle" class="s">BUDGET EXHAUSTED</text>
    <text x="935" y="113" class="x">exception → CRASHED</text>
  </g>

  <!-- Bottom evidence notes -->
  <path d="M125 271V700H310" class="fr"/>
  <g transform="translate(310 655)"><rect width="460" height="88" rx="13" class="n r"/><text x="230" y="27" text-anchor="middle" class="h">Terminal orchestration failure</text><text x="230" y="49" text-anchor="middle" class="x">persist run.json + summary.md after run creation</text><text x="230" y="68" text-anchor="middle" class="m">exception type · message · exit code 1</text></g>
  <text x="2365" y="875" text-anchor="end" class="m">Landscape SVG · editable vector artwork</text>
</svg>
