name: quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize benchmark and tool dependencies
        run: |
          git submodule update --init
          git submodule update --init --recursive benchmarks/randlapack third_party/herbie third_party/tenspiler
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.7
          uv sync --locked --extra dev --extra globus --extra roofline
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake gfortran libopenblas-dev
      - name: Build pinned workload dependencies
        run: uv run --locked --extra dev --extra globus --extra roofline python tools/prepare_workload_dependencies.py build/workload-native --jobs 4
      - name: Run all quality checks
        run: uv run --locked --extra dev --extra globus --extra roofline python tools/check_quality.py
