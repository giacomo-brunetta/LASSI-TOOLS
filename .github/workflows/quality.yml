name: quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e '.[dev,globus]'
      - name: Ruff lint
        id: ruff_lint
        continue-on-error: true
        run: ruff check .
      - name: Ruff format
        id: ruff_format
        continue-on-error: true
        run: ruff format --check .
      - name: Mypy
        id: mypy
        continue-on-error: true
        run: mypy
      - name: Tests
        id: tests
        continue-on-error: true
        run: pytest
      - name: Enforce quality results
        if: always()
        env:
          RUFF_LINT: ${{ steps.ruff_lint.outcome }}
          RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          test "$RUFF_LINT" = success
          test "$RUFF_FORMAT" = success
          test "$MYPY" = success
          test "$TESTS" = success
