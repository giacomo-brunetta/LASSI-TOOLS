[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lassi-x"
version = "0.1.0"
description = "Hermes-powered low-precision scientific translation arena"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  # Pinned exactly: both sides of a run must agree on the wire schema, and the
  # hosted exchange (exchange.academy-agents.org) rejects 0.5.0 messages with
  # HTTP 400. Bump only after verifying a self-ping against the exchange.
  "academy-py==0.4.0",
  "hermes-agent==0.19.0",
  # Direct dependency of the model endpoint preflight, not just a transitive
  # one of mcp: model_doctor imports it and its MockTransport backs the tests.
  "httpx>=0.27",
  # Hermes 0.19 uses the MCP 1.x client protocol. MCP 2.x changes both the
  # streamable-HTTP API and request envelope, so the major versions cannot mix.
  "mcp==1.29.0",
  "numpy>=2.0",
  "pydantic>=2.10",
  # GraphBuilder is the non-deprecated Pydantic Graph orchestration API.
  "pydantic-graph>=1.107,<2",
  "PyYAML>=6.0",
  "torch>=2.5",
  "uvicorn>=0.52.1",
]

[project.optional-dependencies]
globus = [
  "globus-compute-sdk>=3.0",
]
# For the remote node only: runs the Globus Compute endpoint daemon inside the
# same venv as lassi-x, so workers can deserialize the execution agent.
endpoint = [
  "globus-compute-endpoint>=3.0",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
lassi-x = "lassi_x.cli:main"
lassi-x-compat = "compat_tool.cli:main"
lassi-x-compat-wiki = "compat_tool.query_wiki:main"

[tool.setuptools]
packages = ["lassi_x", "lassi_x.remote", "compat_tool"]
package-dir = {lassi_x = "src/lassi_x", compat_tool = "compat_tool"}
include-package-data = false

[tool.setuptools.package-data]
lassi_x = ["resources/**/*"]
compat_tool = ["README.md", "data/*", "pruning.yaml", "targets/*.yaml", "snapshots/**/*", "wiki/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hardware: requires real accelerator hardware",
  "hermes: requires configured Hermes credentials",
  "mem0: requires a running self-hosted Mem0 server (docker/mem0)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "runs"]

[tool.ruff.lint]
select = [
  "A",
  "B",
  "E",
  "F",
  "I",
  "N",
  "PLC0415",
  "SIM",
  "TCH",
  "UP",
  "W",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "examples/polybench-3mm/golden_candidate.py"]
exclude = ["build/", "runs/"]
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy", "academy.mypy_plugin"]

[[tool.mypy.overrides]]
module = "run_agent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "globus_compute_sdk"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plugins.*"
ignore_missing_imports = true
