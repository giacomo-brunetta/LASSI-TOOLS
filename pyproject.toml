[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lassi-x"
version = "0.1.0"
description = "Hermes-powered low-precision scientific translation arena"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  # Keep harness and execution workers on the same Academy wire protocol.
  "academy-py==1.0.0",
  "hermes-agent==0.19.0",
  # Direct dependency of the model endpoint preflight, not just a transitive
  # one of mcp: model_doctor imports it and its MockTransport backs the tests.
  "httpx>=0.27",
  # Hermes 0.19 uses the MCP 1.x client protocol. MCP 2.x changes both the
  # streamable-HTTP API and request envelope, so the major versions cannot mix.
  "mcp==1.29.0",
  "numpy>=2.0",
  "pydantic>=2.14.2,<3",
  # GraphBuilder is the non-deprecated Pydantic Graph orchestration API.
  "pydantic-graph>=2.65,<3",
  "PyYAML>=6.0",
  "torch>=2.5",
  "uvicorn>=0.52.1",
]

[project.optional-dependencies]
roofline = [
  "matplotlib>=3.9",
]
globus = [
  "globus-compute-sdk>=4.19,<5",
  "globus-sdk>=4.10,<5",
]
# For the remote node only: runs the Globus Compute endpoint daemon inside the
# same venv as lassi-x, so workers can deserialize the execution agent.
endpoint = [
  "globus-compute-endpoint>=4.19,<5",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
lassi-x = "lassi_x.cli:main"
lassi-x-compat = "lassi_x.compatibility.cli:main"
lassi-x-compat-wiki = "lassi_x.compatibility.query_wiki:main"

[tool.setuptools]
packages = [
  "lassi_x",
  "lassi_x.compatibility",
  "lassi_x.compatibility.checkers",
  "lassi_x.execution",
  "lassi_x.measurement",
]
include-package-data = false

[tool.setuptools.package-data]
lassi_x = ["resources/**/*"]
"lassi_x.compatibility" = ["README.md", "inventory_data/*", "targets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hardware: requires real accelerator hardware",
  "hermes: requires configured Hermes credentials",
  "mem0: requires a running self-hosted Mem0 server (docker/mem0)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "runs"]

[tool.ruff.lint]
select = [
  "A",
  "B",
  "E",
  "F",
  "I",
  "N",
  "PLC0415",
  "SIM",
  "TCH",
  "UP",
  "W",
]

[tool.mypy]
python_version = "3.12"
files = ["lassi_x", "tests", "tools"]
exclude = ["build/", "runs/"]
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy", "academy.mypy_plugin"]

[[tool.mypy.overrides]]
module = "run_agent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "globus_compute_sdk"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plugins.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "lassi_x.compatibility.checkers.cerebras",
  "lassi_x.compatibility.checkers.poptorch",
]
# These modules intentionally bind optional compiler SDKs at runtime. Their
# public, SDK-independent compatibility API remains checked under strict mode.
ignore_errors = true

[tool.uv]
# Hermes 0.19 pins 2.13.4. Validate this override with the worker/session suite;
# Globus 4.19/SDK 4.10 also require newer cryptography and CA certificates
# than Hermes pins. Remove these overrides when Hermes relaxes its pins.
override-dependencies = ["pydantic>=2.14.2,<3", "cryptography>=50,<51", "certifi>=2026.10.19"]
