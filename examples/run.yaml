version: 1

project:
  root: /absolute/path/to/PolyBenchC-4.2.1

kernel:
  name: 3mm
  reference: linear-algebra/kernels/3mm/3mm.c
  context:
    - linear-algebra/kernels/3mm/3mm.h
  task: Translate PolyBench 3mm into a semantically equivalent PyTorch module.

oracle:
  build:
    - gcc
    - -O3
    - -DDATA_TYPE_IS_DOUBLE
    - -DPOLYBENCH_DUMP_ARRAYS
    - "{reference}"
    - utilities/polybench.c
    - -Iutilities
    - -lm
    - -o
    - "{oracle_dir}/reference"
  run:
    - "{oracle_dir}/reference"
  output: oracle.csv
  capture: stderr
  format: polybench
  timeout_s: 600

arena:
  candidates: 3
  correction_rounds: 2
  equivalence:
    rtol: 0.001
    atol: 0.000001

models:
  planner:
    provider: nous
    model: anthropic/claude-sonnet-4.6
  candidates:
    - {provider: nous, model: openai/gpt-5.2}
    - {provider: nous, model: google/gemini-3-pro-preview}
    - {provider: nous, model: anthropic/claude-sonnet-4.6}
  compensation:
    provider: nous
    model: openai/gpt-5.2

measure:
  precisions: [fp64, fp32, fp16, bf16]
  warmup: 3
  iterations: 20
  stochastic_seeds: [0, 1, 2, 3, 4]
  backends:
    - type: torch
      name: cpu
      device: cpu
      precisions: [fp64, fp32, bf16]
    - type: torch
      name: cuda
      device: cuda
      precisions: [fp64, fp32, fp16, bf16]
    - type: groq
      name: groq
      queue_dir: /shared/lassi-x-groq
      precisions: [fp16]
      timeout_s: 1800
      capabilities:
        storage: [fp16]
        elementwise: [fp16]
        matmul_accumulator: fp32
        explicit_fp32_tensor_ops: false
        fp64: false

compensation:
  enabled: true
  correction_rounds: 2
  # Trigger compensation even when only one candidate survives. Domination is
  # intentionally not compared across candidates, and variants are measured only
  # in the backend/precision cell that motivated them.
  error_threshold: 0.01
  error_metric: max_rel_error
  comparison_scope: same_candidate
  measurement_scope: target

runs_dir: runs
