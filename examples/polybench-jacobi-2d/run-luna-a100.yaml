version: 1

project:
  root: ../../../PolyBenchC-4.2.1

kernel:
  name: polybench-jacobi-2d-mini-luna-a100
  reference: stencils/jacobi-2d/jacobi-2d.c
  context:
    - stencils/jacobi-2d/jacobi-2d.h
  task: >-
    Translate the original PolyBench/C 4.2.1 jacobi-2d MINI kernel into a
    semantically equivalent, export-friendly PyTorch module. Use N=30 and
    TSTEPS=20. Reproduce init_array exactly: A[i,j]=(i*(j+2)+2)/N and
    B[i,j]=(i*(j+3)+3)/N. Expose build_inputs(device, dtype) returning (A, B),
    make_model(), and forward(A, B) returning the final A. Each step updates
    only the interior of B from the five-point stencil on A, then only the
    interior of A from the five-point stencil on the new B, with factor 0.2.
    Keep both arrays' boundaries unchanged for all 20 steps and do not mutate
    the caller's inputs. Preserve the C kernel's update order and FP64
    correctness before considering lower-precision performance.

oracle:
  build:
    - gcc
    - -O0
    - -DPOLYBENCH_DUMP_ARRAYS
    - -include
    - ../LASSI-TOOLS/examples/polybench-jacobi-2d/oracle_precision.h
    - "{reference}"
    - utilities/polybench.c
    - -Iutilities
    - -Istencils/jacobi-2d
    - -lm
    - -o
    - "{oracle_dir}/reference"
  run:
    - "{oracle_dir}/reference"
  output: oracle.csv
  capture: stderr
  format: polybench
  timeout_s: 120

arena:
  candidates: 3
  correction_rounds: 2
  timeout_s: 600
  equivalence:
    rtol: 0.000001
    atol: 0.000001
    max_mismatches: 20

models:
  planner: &luna
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning_effort: medium
  candidates:
    - *luna
    - *luna
    - *luna
  compensation: *luna

execution:
  mode: academy
  exchange_url: https://exchange.academy-agents.org
  auth: globus
  default_resource: a100
  resources:
    a100:
      endpoint_id: b162a840-38b4-4c1a-84cc-579fb62f4dfc
      workspace_root: /home/gbrun/lassi-x-work
      labels: [cuda, a100]
  mcp_timeout_s: 900
  call_timeout_s: 300
  dead_after_timeouts: 2
  heartbeat_interval_s: 5
  heartbeat_misses: 2
  pause_max_s: 900

measure:
  precisions: [fp64, fp32, fp16, bf16]
  warmup: 3
  iterations: 30
  stochastic_seeds: [0, 1, 2, 3, 4]
  backends:
    - type: torch
      name: a100-cuda
      device: cuda
      resource: a100
      precisions: [fp64, fp32, fp16, bf16]

compensation:
  enabled: true
  correction_rounds: 2
  error_threshold: 0.01
  error_metric: max_rel_error
  comparison_scope: same_candidate
  measurement_scope: all

success:
  required_backends: [a100-cuda]
  required_precisions:
    a100-cuda: [fp32, fp16, bf16]

runs_dir: ../LASSI-TOOLS/runs/polybench-jacobi-2d
