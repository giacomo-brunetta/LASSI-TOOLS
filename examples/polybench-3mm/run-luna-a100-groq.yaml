version: 1

project:
  root: ../../../PolyBenchC-4.2.1

kernel:
  name: polybench-3mm-mini-luna-a100
  reference: linear-algebra/kernels/3mm/3mm.c
  context:
    - linear-algebra/kernels/3mm/3mm.h
  task: >-
    Translate the PolyBench/C 4.2.1 3mm MINI kernel into a semantically
    equivalent, export-friendly PyTorch module. Reproduce init_array exactly;
    expose build_inputs(device, dtype) returning (A, B, C, D), make_model(),
    and forward(A, B, C, D) returning G where E=A@B, F=C@D, and G=E@F.

oracle:
  build:
    - gcc
    - -O0
    - -DPOLYBENCH_DUMP_ARRAYS
    - -include
    - ../LASSI-TOOLS/examples/polybench-3mm/oracle_precision.h
    - "{reference}"
    - utilities/polybench.c
    - -Iutilities
    - -Ilinear-algebra/kernels/3mm
    - -lm
    - -o
    - "{oracle_dir}/reference"
  run:
    - "{oracle_dir}/reference"
  output: oracle.csv
  capture: stderr
  format: polybench
  timeout_s: 120

arena:
  candidates: 3
  correction_rounds: 2
  timeout_s: 600
  equivalence:
    rtol: 0.000001
    atol: 0.000001
    max_mismatches: 20

models:
  planner: &luna
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning_effort: medium
  candidates:
    - *luna
    - *luna
    - *luna
  compensation: *luna

execution:
  mode: academy
  exchange_url: https://exchange.academy-agents.org
  auth: globus
  default_resource: a100
  resources:
    a100:
      endpoint_id: b162a840-38b4-4c1a-84cc-579fb62f4dfc
      workspace_root: /home/gbrun/lassi-x-work
      labels: [cuda, a100]
    groq-login:
      endpoint_id: 266f3128-cc9a-403e-ab61-9284ed57d54b
      workspace_root: /home/gbrun/lassi-x-groq-academy
      labels: [groq-login, pbs]
  mcp_timeout_s: 900
  call_timeout_s: 300
  dead_after_timeouts: 2
  heartbeat_interval_s: 5
  heartbeat_misses: 2
  pause_max_s: 900

measure:
  precisions: [fp64, fp32, fp16, bf16]
  warmup: 3
  iterations: 30
  stochastic_seeds: [0, 1, 2, 3, 4]
  backends:
    - type: torch
      name: a100-cuda
      device: cuda
      resource: a100
      precisions: [fp64, fp32, fp16, bf16]
    - type: groq
      name: groq-lpu
      resource: groq-login
      precisions: [fp16]
      timeout_s: 3600
      pbs:
        qsub: /opt/pbs/bin/qsub
        select: select=1:host=groq-r01-gn-06,place=excl
        walltime: "01:00:00"
        conda_sh: /home/gbrun/miniconda3/etc/profile.d/conda.sh
        conda_env: groqflow
        python: /home/gbrun/miniconda3/envs/groqflow/bin/python
        pythonpath:
          - /home/gbrun/LASSI-TOOLS
      capabilities:
        storage: [fp16]
        elementwise: [fp16]
        matmul_accumulator: backend-defined
        explicit_fp32_tensor_ops: false
        fp64: false

compensation:
  enabled: true
  correction_rounds: 2
  error_threshold: 0.01
  error_metric: max_rel_error
  comparison_scope: same_candidate
  measurement_scope: all

success:
  required_backends: [a100-cuda, groq-lpu]
  required_precisions:
    a100-cuda: [fp32, fp16, bf16]
    groq-lpu: [fp16]

runs_dir: ../LASSI-TOOLS/runs/polybench-3mm
