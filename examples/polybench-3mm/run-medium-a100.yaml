version: 1

project:
  root: ../../../PolyBenchC-4.2.1

kernel:
  name: polybench-3mm-medium-a100
  reference: linear-algebra/kernels/3mm/3mm.c
  task: Canonical PyTorch PolyBench 3mm measurement at MEDIUM dimensions.

oracle:
  build:
    - gcc
    - -O0
    - -DPOLYBENCH_DUMP_ARRAYS
    - -include
    - ../LASSI-TOOLS/examples/polybench-3mm/oracle_precision_medium.h
    - "{reference}"
    - utilities/polybench.c
    - -Iutilities
    - -Ilinear-algebra/kernels/3mm
    - -lm
    - -o
    - "{oracle_dir}/reference"
  run: ["{oracle_dir}/reference"]
  output: oracle.csv
  capture: stderr
  format: polybench
  timeout_s: 180

arena:
  candidates: 1
  correction_rounds: 0
  equivalence:
    rtol: 1.0e-6
    atol: 1.0e-6

models:
  planner: {provider: openai-codex, model: gpt-5.6-luna, reasoning_effort: medium}
  candidates: [{provider: openai-codex, model: gpt-5.6-luna, reasoning_effort: medium}]
  compensation: {provider: openai-codex, model: gpt-5.6-luna, reasoning_effort: medium}

execution:
  mode: academy
  exchange_url: https://exchange.academy-agents.org
  auth: globus
  default_resource: a100
  resources:
    a100:
      endpoint_id: b162a840-38b4-4c1a-84cc-579fb62f4dfc
      workspace_root: /home/gbrun/lassi-x-work
  mcp_timeout_s: 900
  call_timeout_s: 300

measure:
  precisions: [fp32]
  warmup: 3
  iterations: 10
  backends:
    - type: torch
      name: a100-cuda
      device: cuda
      resource: a100
      precisions: [fp32]

success:
  required_backends: [a100-cuda]
  required_precisions:
    a100-cuda: [fp32]
