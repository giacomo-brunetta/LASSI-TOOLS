version: 1

project:
  root: ../../../PolyBenchC-4.2.1

kernel:
  name: polybench-3mm-medium-cs3
  reference: linear-algebra/kernels/3mm/3mm.c
  task: Canonical PyTorch PolyBench 3mm measurement at MEDIUM dimensions on Cerebras CS-3.

oracle:
  build:
    - gcc
    - -O0
    - -DPOLYBENCH_DUMP_ARRAYS
    - -include
    - ../LASSI-TOOLS/examples/polybench-3mm/oracle_precision_medium.h
    - "{reference}"
    - utilities/polybench.c
    - -Iutilities
    - -Ilinear-algebra/kernels/3mm
    - -lm
    - -o
    - "{oracle_dir}/reference"
  run: ["{oracle_dir}/reference"]
  output: oracle.csv
  capture: stderr
  format: polybench
  timeout_s: 180

arena:
  candidates: 1
  correction_rounds: 0
  equivalence:
    rtol: 1.0e-6
    atol: 1.0e-6

models:
  planner: {provider: openai-codex, model: gpt-5.6-luna, reasoning_effort: medium}
  candidates: [{provider: openai-codex, model: gpt-5.6-luna, reasoning_effort: medium}]
  compensation: {provider: openai-codex, model: gpt-5.6-luna, reasoning_effort: medium}

execution:
  mode: academy
  exchange_url: https://exchange.academy-agents.org
  auth: globus
  default_resource: cs3
  resources:
    # The CS3 endpoint was started as the existing "lassi-x" endpoint.
    cs3:
      endpoint_id: 266f3128-cc9a-403e-ab61-9284ed57d54b
      workspace_root: /home/gbrun/lassi-x-cs3-work
      labels: [cerebras, cs3, wse3]
  mcp_timeout_s: 1800
  call_timeout_s: 1800
  heartbeat_interval_s: 15
  heartbeat_misses: 120
  pause_max_s: 1800

measure:
  precisions: [fp16]
  warmup: 3
  iterations: 10
  backends:
    - type: native
      name: cerebras-cs3
      architecture: cerebras_wse3
      resource: cs3
      precisions: [fp16]
      worker:
        # Cerebras PyTorch 2.10 interpreter recorded by the CS-3 compatibility sweep.
        python: /home/gbrun/R_2.10.0/venv_cerebras_pt/bin/python
        # This site-owned worker must return a Cerebras profiler/counter interval;
        # LASSI-X rejects host or scheduler timing.
        script: ../LASSI-TOOLS/tools/cerebras_architectural_worker.py

success:
  required_backends: [cerebras-cs3]
  required_precisions:
    cerebras-cs3: [fp16]

runs_dir: ../LASSI-TOOLS/runs/polybench-3mm
