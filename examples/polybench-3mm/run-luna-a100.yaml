version: 1

project:
  root: ../../../PolyBenchC-4.2.1

kernel:
  name: polybench-3mm-mini-luna-a100-graphcore
  reference: linear-algebra/kernels/3mm/3mm.c
  context:
    - linear-algebra/kernels/3mm/3mm.h
  task: >-
    Translate the PolyBench/C 4.2.1 3mm MINI kernel into a semantically
    equivalent, export-friendly PyTorch module. Reproduce init_array exactly;
    expose build_inputs(device, dtype) returning (A, B, C, D), make_model(),
    and forward(A, B, C, D) returning G where E=A@B, F=C@D, and G=E@F.

oracle:
  build:
    - gcc
    - -O0
    - -DPOLYBENCH_DUMP_ARRAYS
    - -include
    - ../LASSI-TOOLS/examples/polybench-3mm/oracle_precision.h
    - "{reference}"
    - utilities/polybench.c
    - -Iutilities
    - -Ilinear-algebra/kernels/3mm
    - -lm
    - -o
    - "{oracle_dir}/reference"
  run:
    - "{oracle_dir}/reference"
  output: oracle.csv
  capture: stderr
  format: polybench
  timeout_s: 120

arena:
  candidates: 3
  correction_rounds: 2
  timeout_s: 600
  equivalence:
    rtol: 0.000001
    atol: 0.000001
    max_mismatches: 20

models:
  planner: &luna
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning_effort: medium
  candidates:
    - *luna
    - *luna
    - *luna
  compensation: *luna

execution:
  mode: academy
  exchange_url: https://exchange.academy-agents.org
  auth: globus
  default_resource: a100
  resources:
    a100:
      endpoint_id: b162a840-38b4-4c1a-84cc-579fb62f4dfc
      workspace_root: /home/gbrun/lassi-x-work
      labels: [cuda, a100]
    graphcore:
      endpoint_id: 2d9a47f0-b768-40d6-ab83-1e2c4c99e11b
      workspace_root: /home/gbrun/lassi-x-graphcore-work
      labels: [graphcore, ipu]
  mcp_timeout_s: 900
  call_timeout_s: 300
  dead_after_timeouts: 2
  # A Graphcore worker is scheduled onto an IPU pod; allow its allocation to
  # start before declaring the persistent Academy agent unreachable.
  heartbeat_interval_s: 15
  heartbeat_misses: 20
  pause_max_s: 900

measure:
  precisions: [fp64, fp32, fp16, bf16]
  warmup: 3
  iterations: 30
  stochastic_seeds: [0, 1, 2, 3, 4]
  backends:
    - type: torch
      name: a100-cuda
      device: cuda
      resource: a100
      precisions: [fp64, fp32, fp16, bf16]
    - type: native
      name: graphcore-ipu
      architecture: graphcore_ipu
      resource: graphcore
      precisions: [fp32, fp16]
      worker:
        # Python 3.8 environment containing the site PopTorch 3.3 wheel.
        python: /home/gbrun/miniconda3/envs/lassi-graphcore-poptorch/bin/python

compensation:
  enabled: true
  correction_rounds: 2
  error_threshold: 0.01
  error_metric: max_rel_error
  comparison_scope: same_candidate
  measurement_scope: all

success:
  required_backends: [a100-cuda, graphcore-ipu]
  required_precisions:
    a100-cuda: [fp32, fp16, bf16]
    graphcore-ipu: [fp32, fp16]

runs_dir: ../LASSI-TOOLS/runs/polybench-3mm
